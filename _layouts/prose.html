---
layout: default
---
<article class="prose">
  <header class="prose-header">
    <h1>{{ page.title }}</h1>
    {% if page.intro %}<p>{{ page.intro }}</p>{% endif %}
    {% if page.updated %}<p class="meta-date">{% if page.lang == 'en' %}Last updated: {% else %}最終更新日：{% endif %}{{ page.updated }}</p>{% endif %}
  </header>
  {{ content }}
</article>
