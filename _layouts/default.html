<!doctype html>
<html lang="{{ page.lang | default: site.lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <meta name="theme-color" content="#0a0b12">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="icon" href="/assets/images/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/css/site.css">
  <meta property="og:type" content="website">
  <meta property="og:title" content="{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}">
  <meta property="og:description" content="{{ page.description | default: site.description | escape }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:image" content="{{ '/assets/images/night-after.png' | absolute_url }}">
  <meta name="twitter:card" content="summary_large_image">
</head>
<body class="{% if page.layout == 'home' %}home-page{% else %}content-page{% endif %}">
  <a class="skip-link" href="#main">{% if page.lang == 'en' %}Skip to content{% else %}本文へ移動{% endif %}</a>
  {% include header.html %}
  <main id="main">{{ content }}</main>
  {% include footer.html %}
  <script src="/assets/js/site.js" defer></script>
</body>
</html>
